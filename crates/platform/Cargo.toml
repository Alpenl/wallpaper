[package]
name = "wallpaper-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "=0.10.9"
wallpaper-core.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "=0.3.2", features = ["objc2-core-media"] }
objc2-core-media = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "=0.62.2", features = ["Win32_System_Registry", "Win32_System_Power", "Win32_Graphics_Dwm", "Win32_Devices_Display", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation"] }
