<!doctype html><html><body style="margin:0;overflow:hidden;background:#000">
<canvas id=c></canvas><script>
// 固定负载的全屏 shader（类 Shadertoy 等离子），rAF 驱动；?fps=30 可限帧
const fps = +(new URLSearchParams(location.search).get('fps')||0);
const c=document.getElementById('c'); c.width=1920; c.height=1080;
const gl=c.getContext('webgl'); 
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`precision mediump float;uniform float t;uniform vec2 r;void main(){vec2 u=gl_FragCoord.xy/r;
float v=sin(u.x*10.+t)+sin(u.y*10.+t)+sin((u.x+u.y)*10.+t)+sin(length(u-.5)*20.-t);gl_FragColor=vec4(.5+.5*sin(v),.5+.5*sin(v+2.),.5+.5*sin(v+4.),1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const ut=gl.getUniformLocation(pr,'t'),ur=gl.getUniformLocation(pr,'r');let last=0,frames=0;
function f(ts){requestAnimationFrame(f); if(fps&&ts-last<1000/fps-1)return; last=ts; frames++;
gl.viewport(0,0,c.width,c.height);gl.uniform1f(ut,ts/1000);gl.uniform2f(ur,c.width,c.height);gl.drawArrays(gl.TRIANGLES,0,3);}
requestAnimationFrame(f); setInterval(()=>{document.title='frames='+frames;},1000);
</script></body></html>
