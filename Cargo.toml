[workspace]
members = ["crates/core", "crates/platform", "crates/ui", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "PolyForm-Strict-1.0.0"

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wallpaper-core = { path = "crates/core" }
wallpaper-platform = { path = "crates/platform" }
wallpaper-ui = { path = "crates/ui" }
